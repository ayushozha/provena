name: Store

on:
  pull_request:
    paths:
      - "app/**"
      - "storage/**"
      - "tests/**"
      - "intelligence/**"
      - "control-plane/**"
      - "orchestration/**"
      - "sdk/**"
      - "docker-compose.yml"
      - "Dockerfile.store"
      - ".env.example"
      - "DEPLOYMENT.md"
      - "README.md"
      - "scripts/run_e2e.py"
      - "scripts/export_openapi.py"
      - "openapi.json"
      - "pyproject.toml"
      - ".github/workflows/ci-store.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "storage/**"
      - "tests/**"
      - "intelligence/**"
      - "control-plane/**"
      - "orchestration/**"
      - "sdk/**"
      - "docker-compose.yml"
      - "Dockerfile.store"
      - ".env.example"
      - "DEPLOYMENT.md"
      - "README.md"
      - "scripts/run_e2e.py"
      - "scripts/export_openapi.py"
      - "openapi.json"
      - "pyproject.toml"
      - ".github/workflows/ci-store.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVENA_ENVIRONMENT: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: provena
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install store and test dependencies
        run: python -m pip install -e ".[dev]" pytest
      - name: Test SQLite store and API
        run: python -m pytest -m "not postgres"
      - name: Test real PostgreSQL store
        run: python -m pytest -m postgres tests/test_postgres_store.py
        env:
          PROVENA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/provena
      - name: Verify checked-in OpenAPI schema
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install intelligence and test dependencies
        run: python -m pip install -e ./intelligence pytest
      - name: Test request-scoped store authentication
        run: python -m pytest intelligence/tests -q

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test queue and control plane
        run: go test ./...

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the shipped Compose services
        run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROVENA_ENVIRONMENT: test
      PROVENA_E2E_TMP_DIR: ${{ runner.temp }}/provena-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python services
        run: python -m pip install -e ".[dev]" -e ./intelligence pytest
      - name: Run authenticated polyglot end-to-end verification
        run: python scripts/run_e2e.py
      - name: Verify end-to-end schema export is deterministic
        run: git diff --exit-code -- openapi.json
