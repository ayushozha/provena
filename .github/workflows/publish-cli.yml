name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install Python (store e2e tests spawn uvicorn)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ..
        working-directory: cli

      - run: npm ci
      - run: npm test
      - run: node tests/pack-install.test.mjs

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}