name: CLI

on:
  pull_request:
    paths:
      - "cli/**"
      - "pyproject.toml"
      - ".github/workflows/ci-cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ..
      - run: npm ci
      - run: npm test