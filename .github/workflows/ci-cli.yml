name: Provena

on:
  pull_request:
    paths:
      - "cli/**"
      - "app/**"
      - "storage/**"
      - "tests/**"
      - "intelligence/app/**"
      - "intelligence/eval/**"
      - "intelligence/tests/**"
      - "intelligence/pyproject.toml"
      - "openapi.json"
      - "pyproject.toml"
      - "requirements.lock"
      - "uv.lock"
      - "Dockerfile.store"
      - ".dockerignore"
      - ".github/workflows/ci-cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "app/**"
      - "storage/**"
      - "tests/**"
      - "intelligence/app/**"
      - "intelligence/eval/**"
      - "intelligence/tests/**"
      - "intelligence/pyproject.toml"
      - "openapi.json"
      - "pyproject.toml"
      - "requirements.lock"
      - "uv.lock"
      - "Dockerfile.store"
      - ".dockerignore"
      - ".github/workflows/ci-cli.yml"

jobs:
  test:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.17.0", "24.x"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ..
      - run: npm ci
      - run: npm test

  repository-memory-bridge:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" -e ./intelligence pytest
      - name: Test SQLite memory contracts
        env:
          PROVENA_DATABASE_URL: ""
        run: python -m pytest tests/test_main.py -q
      - name: Test PostgreSQL memory contracts
        env:
          PROVENA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/provena
        run: python -m pytest tests/test_postgres_store.py -q
      - name: Test intelligence fingerprint contract
        working-directory: intelligence
        run: python -m pytest tests -q
      - name: Verify exported OpenAPI is current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  store-image-smoke:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build governed store image
        run: docker build --file Dockerfile.store --tag provena-store:ci .
      - name: Start store and verify health
        run: |
          docker run --detach --name provena-store-smoke provena-store:ci
          for attempt in {1..30}; do
            if docker exec provena-store-smoke python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['status'] == 'ok'"; then
              exit 0
            fi
            sleep 1
          done
          docker logs provena-store-smoke
          exit 1
      - name: Stop store container
        if: always()
        run: docker rm --force provena-store-smoke || true
