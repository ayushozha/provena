[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "altrixy-provena-sdk"
version = "0.1.0"
description = "Publishable Python SDK for integrating with the Provena governed memory plane."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1.0.0"]
keywords = ["provena", "memory-plane", "sdk", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ayushozha/provena/tree/main/sdk/python"
Repository = "https://github.com/ayushozha/provena"
Issues = "https://github.com/ayushozha/provena/issues"

[project.scripts]
provena-sdk-smoke = "provena_sdk.smoke:main"

[tool.setuptools.packages.find]
include = ["provena_sdk*"]
