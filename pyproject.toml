[project]
name = "provena"
version = "0.1.0"
description = "Provenance-first memory service for LLM applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "sqlite-vec>=0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
