[project]
name = "provena"
version = "0.1.0"
description = "Provenance-first memory service for LLM applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "sqlite-vec>=0.1.9",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
dev = ["fakeredis>=2.26.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: integration tests requiring PROVENA_DATABASE_URL",
]
