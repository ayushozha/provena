[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "provena-intelligence"
version = "0.1.0"
description = "Provena ML/LLM intelligence layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143.0,<1",
  "uvicorn>=0.54.0,<1",
  "pydantic>=2.14.0,<3",
  "pydantic-settings>=2.15.0,<3",
  "httpx>=0.28.1,<1",
  "anyio>=4.15.1,<5",
  "numpy>=2.4.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]
namespaces = false

[tool.setuptools.package-data]
eval = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
