[project]
name = "provena-intelligence"
version = "0.1.0"
description = "Provena ML/LLM intelligence layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
]

[tool.setuptools]
packages = ["app", "eval"]

[tool.setuptools.package-data]
eval = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
